<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: teal;
            color: white;
            text-align: center;
            font-family: Arial;
        }
        
        main {
            background: rgba(255, 255, 255, 0.3);
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 15px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 20px;
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>DIGITAL CODE HUB</h1>
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
    </header>

    <main>
        <h2>Login</h2>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Login</button>
        <p><a href="#">Register</a></p>
    </main>

    <footer>
        <p>© 2023 Digital code hub</p>
    </footer>
</body>
</html>
