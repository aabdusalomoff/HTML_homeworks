<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        body {
            background: blue;
            padding: 50px;
        }
        
        form {
            background: white;
            width: 900px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
        }
        
        input {
            width: 250px;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        button {
            background: blue;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <form>
        <h1>Registration</h1>
        
        <h3>Personal Details</h3>
        <input type="text" placeholder="Full Name">
        <input type="text" placeholder="Date of Birth">
        <input type="email" placeholder="Email">
        <br>
        <input type="tel" placeholder="Mobile number">
        <input type="text" placeholder="Gender">
        <input type="text" placeholder="Occupation">
        
        <h3>Identity Details</h3>
        <input type="text" placeholder="ID Type">
        <input type="text" placeholder="ID Number">
        <input type="text" placeholder="Issue Authority">
        <br>
        <input type="text" placeholder="Issue Date">
        <input type="text" placeholder="Issue State">
        <input type="text" placeholder="Expiry Date">
        
        <br>
        <button>Next →</button>
    </form>
</body>
</html>
